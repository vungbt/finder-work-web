query allJobTitle(
  $where: JobTitleWhereInput
  $pagination: PaginationInput
  $searchValue: String
  $orderBy: [JobTitleOrderByWithRelationInput!]
) {
  all_job_title(
    where: $where
    pagination: $pagination
    searchValue: $searchValue
    orderBy: $orderBy
  ) {
    data {
      id
      name
      isFeature
      createdAt
      updatedAt
    }
    metadata {
      total
      limit
      page
    }
  }
}
