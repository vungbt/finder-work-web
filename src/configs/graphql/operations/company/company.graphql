query allCompany(
  $where: CompanyWhereInput
  $orderBy: [CompanyOrderByWithRelationInput!]
  $searchValue: String
  $pagination: PaginationInput
) {
  all_company(
    where: $where
    orderBy: $orderBy
    searchValue: $searchValue
    pagination: $pagination
  ) {
    metadata {
      total
      page
      limit
    }
    data {
      id
      name
      slug
      description
      # address {
      #   id
      #   name
      #   stateName
      #   countryName
      # }
      addressDetail
      # avatar {
      #   url
      # }
      # photos {
      #   url
      # }
    }
  }
}
