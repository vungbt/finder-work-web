mutation reportPost($data: ReportPostCreateInput!) {
  create_report_post(data: $data) {
    id
    reason
    message
    postId
    userId
    createdAt
    updatedAt
    deletedAt
  }
}

query allReportPost(
  $where: ReportPostWhereInput
  $orderBy: [ReportPostOrderByWithRelationInput!]
  $searchValue: String
  $pagination: PaginationInput
) {
  all_report_post(
    where: $where
    orderBy: $orderBy
    searchValue: $searchValue
    pagination: $pagination
  ) {
    data {
      id
      reason
      message
      postId
      userId
      createdAt
      updatedAt
      deletedAt
      status
      post {
        slug
      }
      user {
        id
        avatarUrl
        firstName
        lastName
        email
        color
        addressDetail
        phoneNumber
        role
        createdAt
        updatedAt
      }
    }
    metadata {
      ...Metadata
    }
  }
}

mutation deleteReportPost($where: ReportPostWhereUniqueInput!) {
  delete_report_post(where: $where) {
    id
    reason
    message
    postId
    userId
    createdAt
    updatedAt
    deletedAt
  }
}

mutation updateReportPost($data: ReportPostUpdateInput!, $where: ReportPostWhereUniqueInput!) {
  update_report_post(data: $data, where: $where) {
    id
    postId
    userId
    updatedAt
    deletedAt
    status
  }
}
